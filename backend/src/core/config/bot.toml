environment = "dev"
operation = "day_trader"
risk_profile = "conservative"
run_mode = "observe"

[market]
symbol = "BTC/USDT"
timeframe = "15m"
candle_limit = 120
poll_seconds = 15

[strategy]
sma_fast = 5
sma_slow = 20
# Optional extra monitor/catalog strategies:
# [[strategy.monitor_registry]]
# id = "sma-cross"
# version = 2
# name = "SMA crossover alt"
# fast_period = 3
# slow_period = 15
# evaluator = "ema_cross"  # optional; default sma_cross

[risk]
max_order_quote = 25.0
max_daily_loss_quote = 25.0
max_open_positions = 1

[production]
enabled = false
acknowledgement = ""

[jev]
enabled = false
market_regime = true
signal_review = true
ops_triage = true
timeout_seconds = 8

[logging]
level = "info"
directory = "logs"
