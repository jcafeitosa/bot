# System defaults (non-sensitive, committed).
# Source of truth for secrets and connection strings: backend/.env (gitignored).
# Env always wins over these defaults when set.

[postgres]
# Runtime: DATABASE_URL in .env only (never commit credentials here).

# Legacy section name: `[agents].enabled` is the TOML fallback when neither `BOT_GRAPH_ENABLED`
# nor `BOT_AGENTS_ENABLED` is set. Semantics: optional Neo4j graph stack (readiness, CLI graph
# query, PG→Neo4j projection outbox F2.1+) — NOT an HTTP "agents module" toggle. Env preferred
# name: `BOT_GRAPH_ENABLED`; `BOT_AGENTS_ENABLED` remains supported (deprecated). Both set → on if
# either is true. Loader rename backlog: `load_graph_runtime_from_env` (unified-neo4j-graph-strategy.md).
[agents]
enabled = false
monitor_agency = ""

# Connection defaults when graph stack enabled (env `BOT_NEO4J_*` overrides each field).
[neo4j]
uri = "bolt://127.0.0.1:7688"
user = "neo4j"
database = "neo4j"
# Background drain of graph_projection_outbox when PG + Neo4j wired (0 = disabled).
graph_projection_outbox_drain_secs = 30
# Password: BOT_NEO4J_PASSWORD in .env only.

[monitor]
persist_market_data = false

[orders]
execution = ""
exchange_submit = ""
paper_fill_unit_price = 0.0
reconciliation_poll_secs = 0

[bots]
runtime_enabled = false

[http.admin]
# Admin bearer and bindings: BOT_HTTP_ADMIN_TOKEN, BOT_HTTP_OWNER_ID, BOT_HTTP_AGENCY_ID in .env.

[providers]
typesafe_endpoint = "https://api.typesafe.ai/v1/systemone"
openai_base_url = ""
nim_base_url = ""
# API keys: TYPESAFE_API_KEY, OPENAI_API_KEY, NVIDIA_API_KEY, NGC_API_KEY in .env.
