# Illustrative strategy presets. These modes are profiles, not guarantees of performance.
# HFT is intentionally unsupported by the 1m REST adapter.
[scalper]
timeframes = ["1m", "3m", "5m"]
fast_period = 5
slow_period = 20

[day_trader]
timeframes = ["5m", "15m", "30m"]
fast_period = 5
slow_period = 20

[swing_trader]
timeframes = ["1h", "4h"]
fast_period = 20
slow_period = 50

[hft]
enabled = false
reason = "Requires low-latency market feed and execution; not supported by ccxt-rust REST polling adapter"
